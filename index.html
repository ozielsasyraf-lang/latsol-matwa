/* ============================================================
   RENDER & LOGIC
   ============================================================ */
let scorePG = 0, scoreTF = 0;
let pgAnswered = new Array(pgDataFixed.length).fill(false);
let tfAnswered = new Array(tfData.length).fill(false);

// Render PG
const pgContainer = document.getElementById('pgContainer');
pgDataFixed.forEach((item, i) => {
  const div = document.createElement('div');
  div.className = 'pg-item';
  let optsHTML = '';
  item.opts.forEach((opt, j) => {
    optsHTML += `<label class="option" id="pg-${i}-opt-${j}" onclick="checkPG(${i},${j})">
      <input type="radio" name="pg${i}" value="${j}"><span>${String.fromCharCode(65+j)}. ${opt}</span>
    </label>`;
  });
  div.innerHTML = `<p>${i+1}. ${item.q}</p>${optsHTML}
    <div class="feedback" id="pg-fb-${i}"></div>
    <div class="pg-solution" id="pg-sol-${i}"><b>Pembahasan:</b> ${item.sol}</div>`;
  pgContainer.appendChild(div);
});

// Render B/S
const tfContainer = document.getElementById('tfContainer');
tfData.forEach((item, i) => {
  const div = document.createElement('div');
  div.className = 'tf-item';
  div.innerHTML = `<span>${i+1}. ${item.q}</span>
    <div class="tf-btns">
      <button class="tf-btn" id="tf-${i}-b" onclick="checkTF(${i}, true)">B</button>
      <button class="tf-btn" id="tf-${i}-s" onclick="checkTF(${i}, false)">S</button>
    </div>
    <div class="feedback" id="tf-fb-${i}" style="width:100%;"></div>`;
  tfContainer.appendChild(div);
});

// Render Essay
const essayContainer = document.getElementById('essayContainer');
essayData.forEach((item, i) => {
  const div = document.createElement('div');
  div.className = 'essay-item';
  div.innerHTML = `<p>Soal ${i+1} (HOTS). ${item.q}</p>
    <textarea placeholder="Tulis jawaban Anda di sini..."></textarea>
    <button class="essay-toggle" onclick="toggleEssay(${i})">📖 Lihat Pembahasan Lengkap</button>
    <div class="essay-answer" id="essay-ans-${i}"><b>Pembahasan:</b><br>${item.ans.replace(/\n/g,'<br>')}</div>`;
  essayContainer.appendChild(div);
});

// Check PG
function checkPG(qIdx, optIdx) {
  if (pgAnswered[qIdx]) return;
  pgAnswered[qIdx] = true;
  const correct = pgDataFixed[qIdx].ans;
  const fb = document.getElementById(`pg-fb-${qIdx}`);
  const sol = document.getElementById(`pg-sol-${qIdx}`);
  // Disable all options
  pgDataFixed[qIdx].opts.forEach((_, j) => {
    const el = document.getElementById(`pg-${qIdx}-opt-${j}`);
    el.classList.add('disabled');
    if (j === correct) el.classList.add('correct');
  });
  if (optIdx === correct) {
    scorePG++;
    fb.className = 'feedback show ok';
    fb.textContent = '✅ Benar!';
  } else {
    document.getElementById(`pg-${qIdx}-opt-${optIdx}`).classList.add('wrong');
    fb.className = 'feedback show no';
    fb.textContent = `❌ Salah. Jawaban yang benar: ${String.fromCharCode(65+correct)}.`;
  }
  sol.classList.add('show');
  document.getElementById('scorePG').textContent = scorePG;
}

// Check TF
function checkTF(qIdx, userAns) {
  if (tfAnswered[qIdx]) return;
  tfAnswered[qIdx] = true;
  const correct = tfData[qIdx].ans;
  const fb = document.getElementById(`tf-fb-${qIdx}`);
  const btnB = document.getElementById(`tf-${qIdx}-b`);
  const btnS = document.getElementById(`tf-${qIdx}-s`);
  btnB.classList.add('disabled');
  btnS.classList.add('disabled');
  if (userAns === correct) {
    scoreTF++;
    (userAns ? btnB : btnS).classList.add(userAns ? 'selected-b' : 'selected-s');
    fb.className = 'feedback show ok';
    fb.textContent = `✅ Benar! ${tfData[qIdx].sol}`;
  } else {
    (userAns ? btnB : btnS).classList.add(userAns ? 'selected-b' : 'selected-s');
    fb.className = 'feedback show no';
    fb.textContent = `❌ Salah. Jawaban: ${correct ? 'BENAR' : 'SALAH'}. ${tfData[qIdx].sol}`;
  }
  document.getElementById('scoreTF').textContent = scoreTF;
}

// Toggle essay
function toggleEssay(i) {
  const el = document.getElementById(`essay-ans-${i}`);
  el.classList.toggle('show');
}

// Reset
function resetAll() {
  scorePG = 0; scoreTF = 0;
  pgAnswered.fill(false);
  tfAnswered.fill(false);
  document.getElementById('scorePG').textContent = '0';
  document.getElementById('scoreTF').textContent = '0';
  // Reset PG
  pgDataFixed.forEach((_, i) => {
    document.getElementById(`pg-fb-${i}`).className = 'feedback';
    document.getElementById(`pg-sol-${i}`).classList.remove('show');
    pgDataFixed[i].opts.forEach((__, j) => {
      const el = document.getElementById(`pg-${i}-opt-${j}`);
      el.classList.remove('correct','wrong','disabled');
      el.querySelector('input').checked = false;
    });
  });
  // Reset TF
  tfData.forEach((_, i) => {
    document.getElementById(`tf-fb-${i}`).className = 'feedback';
    const b = document.getElementById(`tf-${i}-b`);
    const s = document.getElementById(`tf-${i}-s`);
    b.classList.remove('selected-b','selected-s','disabled');
    s.classList.remove('selected-b','selected-s','disabled');
  });
  // Reset essay answers visibility
  essayData.forEach((_, i) => {
    document.getElementById(`essay-ans-${i}`).classList.remove('show');
  });
}
</script>
